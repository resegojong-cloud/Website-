<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Laone Ralph Pholo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #2c161c 0%, #4a2330 50%, #1a0d11 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        /* Floating background hearts container */
        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        /* Individual floating heart styling */
        .heart {
            position: absolute;
            background-color: #ff4d79;
            transform: rotate(-45deg);
            animation: floatUp linear infinite;
            opacity: 0.7;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: inherit;
            border-radius: 50%;
        }

        .heart::before {
            top: -50%;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 50%;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) rotate(-45deg) scale(0.6);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) rotate(-45deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Center card with glowing text */
        .love-card {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 45px 50px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 182, 193, 0.2);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        0 0 30px rgba(255, 77, 121, 0.2);
            animation: pulseCard 3s ease-in-out infinite;
            max-width: 650px;
            width: 100%;
        }

        h1 {
            color: #fff;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 77, 121, 0.8),
                         0 0 40px rgba(255, 77, 121, 0.4);
            animation: glowText 2s ease-in-out infinite alternate;
        }

        .name {
            color: #ffb6c1;
            font-size: clamp(1.3rem, 2.5vw, 1.8rem);
            margin-top: 8px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
        }

        .divider {
            width: 60px;
            height: 2px;
            background: rgba(255, 182, 193, 0.4);
            margin: 20px auto;
        }

        .note {
            color: #fce4ec;
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            line-height: 1.6;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 77, 121, 0.3);
        }

        @keyframes glowText {
            0% {
                text-shadow: 0 0 10px rgba(255, 77, 121, 0.6), 0 0 20px rgba(255, 77, 121, 0.3);
            }
            100% {
                text-shadow: 0 0 25px rgba(255, 182, 193, 0.9), 0 0 50px rgba(255, 77, 121, 0.6);
            }
        }

        @keyframes pulseCard {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(255, 77, 121, 0.2);
            }
            50% {
                transform: scale(1.02);
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 45px rgba(255, 77, 121, 0.4);
            }
        }
    </style>
</head>
<body>

    <!-- Floating hearts animation container -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Central Glowing Message -->
    <div class="love-card">
        <h1>I Love You</h1>
        <div class="name">Laone Ralph Pholo</div>
        <div class="divider"></div>
        <div class="note">
            "We may have known each other for 4 years now, but I don’t want to not know you in the next 8 years."
        </div>
    </div>

    <script>
        // JavaScript to dynamically generate floating hearts with random sizes, positions, and speeds
        const container = document.getElementById('heartsContainer');
        const heartCount = 35;

        for (let i = 0; i < heartCount; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart');

            // Randomize starting positions and animation properties
            const size = Math.random() * 22 + 10; // Size between 10px and 32px
            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;
            
            heart.style.left = `${Math.random() * 100}%`;
            
            const duration = Math.random() * 4 + 3; // Speed between 3s and 7s
            heart.style.animationDuration = `${duration}s`;
            
            const delay = Math.random() * 5; // Staggered start times
            heart.style.animationDelay = `${delay}s`;

            // Soft color variation for depth
            const colors = ['#ff4d79', '#ff758c', '#ffb6c1', '#e6005c'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            heart.style.backgroundColor = randomColor;

            container.appendChild(heart);
        }
    </script>
</body>
</html>
