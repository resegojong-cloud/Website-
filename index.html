<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Laone Ralph Pholo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #05050a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Central Glowing Card Overlay */
        .content-box {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 35px 45px;
            max-width: 620px;
            width: 90%;
            background: rgba(5, 5, 10, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 162, 255, 0.2);
        }

        h1 {
            color: #fff;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 195, 255, 0.9),
                         0 0 30px rgba(0, 119, 255, 0.6),
                         0 0 50px rgba(0, 119, 255, 0.4);
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        .name {
            color: #00e5ff;
            font-size: clamp(1.3rem, 2.8vw, 1.8rem);
            margin-top: 8px;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.8),
                         0 0 30px rgba(0, 149, 255, 0.5);
        }

        .divider {
            width: 50px;
            height: 2px;
            background: rgba(0, 229, 255, 0.4);
            margin: 15px auto;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
        }

        .note {
            color: #e0f7fa;
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            line-height: 1.5;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(0, 195, 255, 0.4);
        }

        @keyframes pulseGlow {
            0% {
                text-shadow: 0 0 15px rgba(0, 195, 255, 0.7), 0 0 30px rgba(0, 119, 255, 0.4);
            }
            100% {
                text-shadow: 0 0 25px rgba(0, 229, 255, 1), 0 0 50px rgba(0, 149, 255, 0.8), 0 0 80px rgba(0, 149, 255, 0.5);
            }
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <div class="content-box">
        <h1>I Love You</h1>
        <div class="name">Laone Ralph Pholo</div>
        <div class="divider"></div>
        <div class="note">
            "We may have known each other for 4 years now, but I don’t want to not know you in the next 8 years."
        </div>
    </div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = 1200;

        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x: x, y: y };
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                t: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.02 + 0.01,
                size: Math.random() * 2 + 1,
                alpha: Math.random() * 0.8 + 0.2,
                color: Math.random() > 0.3 ? '#00bfff' : '#ffffff'
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 10, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = Math.min(canvas.width, canvas.height) / 35;

            particles.forEach(p => {
                p.t += p.speed;
                if (p.t > Math.PI * 2) p.t = 0;

                const pt = getHeartPoint(p.t);
                const x = centerX + pt.x * scale;
                const y = centerY + pt.y * scale + Math.sin(Date.now() * 0.003 + p.t) * 10;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00bfff';
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
