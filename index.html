<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Laone Ralph Pholo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #020205;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Top Header / Title */
        .top-header {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-top: 15px;
            animation: fadeInDown 2s ease-out;
        }

        .top-header h1 {
            color: #fff;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 400;
            letter-spacing: 3px;
            font-style: italic;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9),
                         0 0 30px rgba(255, 20, 147, 0.6);
        }

        .top-header span {
            color: #ff3399;
            font-size: 1.5rem;
            margin-left: 5px;
            text-shadow: 0 0 15px rgba(255, 51, 153, 1);
        }

        /* Bottom Note & Name Box */
        .bottom-card {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 650px;
            width: 90%;
            padding: 25px 30px;
            margin-bottom: 20px;
            background: rgba(10, 5, 15, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 105, 180, 0.2);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.25);
            animation: fadeInUp 2s ease-out;
        }

        .name {
            color: #ff66b2;
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(255, 102, 178, 0.8);
        }

        .note {
            color: #fce4ec;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            line-height: 1.5;
            font-style: italic;
            font-weight: 300;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.4);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <canvas id="galaxyCanvas"></canvas>

    <!-- Top Floating Title -->
    <div class="top-header">
        <h1>I Love You <span>❤️</span></h1>
    </div>

    <!-- Spacer to let the 3D heart shine in the middle -->
    <div></div>

    <!-- Bottom Personal Note Card -->
    <div class="bottom-card">
        <div class="name">Laone Ralph Pholo</div>
        <div class="note">
            "We may have known each other for 4 years now, but I don’t want to not know you in the next 8 years."
        </div>
    </div>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Starfield / Galaxy particles & Heart particles
        const particles = [];
        const starCount = 1500;
        let angle = 0;

        // Generate 3D Heart Points
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x: x, y: y };
        }

        // Initialize background stars and galaxy particles
        for (let i = 0; i < starCount; i++) {
            particles.push({
                x: (Math.random() - 0.5) * canvas.width * 2,
                y: (Math.random() - 0.5) * canvas.height * 2,
                z: Math.random() * canvas.width,
                size: Math.random() * 1.5 + 0.5,
                color: Math.random() > 0.4 ? '#ff66b2' : '#ffffff'
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(2, 2, 5, 0.25)'; // Motion blur trail
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            angle += 0.008; // Rotation speed of the galaxy

            // Draw twinkling background stars & galaxy dust
            particles.forEach(p => {
                p.z -= 0.5;
                if (p.z <= 0) p.z = canvas.width;

                const k = 250 / p.z;
                const px = p.x * k + cx;
                const py = p.y * k + cy;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    const size = Math.max(0.1, p.size * k);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Draw Central 3D Rotating Heart Galaxy
            const heartScale = Math.min(canvas.width, canvas.height) / 38;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff2a85';

            for (let t = 0; t < Math.PI * 2; t += 0.04) {
                const pt = getHeartPoint(t);
                
                // 3D Rotation Matrix around Y-axis
                const x3d = pt.x * heartScale;
                const y3d = pt.y * heartScale;
                const z3d = 0; // flat plane or layered

                const cosA = Math.cos(angle);
                const sinA = Math.sin(angle);
                
                const rotX = x3d * cosA - z3d * sinA;
                const rotZ = x3d * sinA + z3d * cosA;

                const fov = 400;
                const scaleProjection = fov / (fov + rotZ);
                const screenX = cx + rotX * scaleProjection;
                const screenY = cy + y3d * scaleProjection;

                ctx.fillStyle = '#ff3399';
                ctx.beginPath();
                ctx.arc(screenX, screenY, 2.2 * scaleProjection, 0, Math.PI * 2);
                ctx.fill();

                // Inner glowing core particles for the heart
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(screenX + (Math.random() - 0.5) * 4, screenY + (Math.random() - 0.5) * 4, 1, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
