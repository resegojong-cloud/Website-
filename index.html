<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Laone Ralph Pholo 💙</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        #heart {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .love {
            position: absolute;
            color: #00aaff;
            font-weight: bold;
            white-space: nowrap;
            text-shadow:
                0 0 5px #008cff,
                0 0 10px #008cff,
                0 0 20px #006eff;
            animation: appear 1.5s ease forwards;
            opacity: 0;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.2);
            }

            to {
                opacity: 0.85;
                transform: scale(1);
            }
        }

        .name {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: clamp(20px, 4vw, 42px);
            font-weight: bold;
            text-align: center;
            z-index: 10;
            text-shadow:
                0 0 10px white,
                0 0 25px #00aaff;
        }

        .subtitle {
            position: absolute;
            top: calc(50% + 50px);
            left: 50%;
            transform: translateX(-50%);
            color: #00aaff;
            font-size: 18px;
            z-index: 10;
        }
    </style>
</head>

<body>

<div id="heart"></div>

<div class="name">
    Laone Ralph Pholo
</div>

<div class="subtitle">
    I LOVE YOU 💙
</div>

<script>

const heart = document.getElementById("heart");

const TOTAL = 2000;

const width = window.innerWidth;
const height = window.innerHeight;

const centerX = width / 2;
const centerY = height / 2;

function heartEquation(t) {

    // Parametric heart
    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x,
        y: -y
    };
}


// Create 2000 "I LOVE YOU"s
for (let i = 0; i < TOTAL; i++) {

    const love = document.createElement("div");

    love.className = "love";
    love.innerText = "I LOVE YOU";

    // Random position inside the heart
    let point;

    do {

        const t = Math.random() * Math.PI * 2;

        const scale = Math.sqrt(Math.random());

        point = heartEquation(t);

        point.x *= scale;
        point.y *= scale;

    } while (
        Math.abs(point.x) > 15 ||
        Math.abs(point.y) > 14
    );


    // Scale heart to screen
    const scaleX = Math.min(width / 36, 25);
    const scaleY = Math.min(height / 32, 22);

    const x = centerX + point.x * scaleX;
    const y = centerY + point.y * scaleY;


    love.style.left = x + "px";
    love.style.top = y + "px";


    // Different sizes
    const size = Math.random() * 9 + 7;

    love.style.fontSize = size + "px";


    // Random blue shades
    const blue = 180 + Math.floor(Math.random() * 76);

    love.style.color = `rgb(0, ${blue}, 255)`;


    // Random animation delay
    love.style.animationDelay =
        (Math.random() * 2.5) + "s";


    heart.appendChild(love);
}

</script>

</body>
</html>
